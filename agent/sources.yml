# v1: MDB / STS source repos only. Other wiki projects stay stubs.
# ignore: drop these source paths before Bedrock. Everything else in the
# watermark window is sent. .github/ is NOT ignored — workflow changes can
# affect how promotions/tests run and belong in the wiki prompt.
wiki_pages_root: src/content/docs/mdb-sts

ignore:
  - tests/**
  - devops/**
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/package-lock.json"
  - "**/poetry.lock"
  - "**/uv.lock"
  - "**/Pipfile.lock"
  - docs/conf.py
  - "**/CONTRIBUTING.md"
  - "**/CONDUCT.md"
  - "**/SECURITY.md"

repos:
  - github: CBIIT/bento-sts-fastapi
    pages:
      - src/content/docs/mdb-sts/how-we-test.md
      - src/content/docs/mdb-sts/index.md

  - github: CBIIT/bento-mdb
    pages:
      - src/content/docs/mdb-sts/data-promotion.md
      - src/content/docs/mdb-sts/index.md
